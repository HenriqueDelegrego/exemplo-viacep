<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo ViaCEP</title>
    <link rel="stylesheet" href="viacep.css">
    <script src="viacep-service.js" defer></script>
    <script src="viacep.js" defer></script>
</head>

<body>

    <h2>Exemplo ViaCEP</h2>
    <form>
        <label>
            CEP:
            <input type="text" inputmode="numeric" id="cep" maxlength="8">
        </label>
        <label>
            Logradouro:
            <input type="text" id="logradouro">
        </label>
        <label>
            Bairro:
            <input type="text" id="bairro">
        </label>
        <label>
            Cidade:
            <input type="text" id="cidade">
        </label>
        <label>
            Estado:
            <input type="text" id="uf">
        </label>
    </form>
</body>

</html>
